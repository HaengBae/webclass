<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글씨크기조절</title>
    <link rel="stylesheet" href="./css/ex1.css">
    <script src="./js/ex1.js"></script>
</head>
<body>
    <div class="fontControl">
        <span id="btn-toggle"><img src="./img/menu.svg" alt="닫기"></span>
        <span id="btn-font-up">크게</span>
        <span id="btn-font-down">작게</span>
    </div>
    <div class="wrap">
        <h1>여름 여행 계획</h1>
        <p>무더운 날씨를 피해 산책과 바다를 즐길 수 있는 여행 코스를 준비해 보았습니다.</p>
        <h2>제주도 2박 3일 루트</h2>
        <p>첫날에는 협재해변에서 아침을 맞이하고, 한라산 자락을 따라 오름을 둘러보며 여유로운 시간을 보냈습니다.</p>
        <p>둘째 날에는 성산일출봉과 우도까지 이동하면서 푸른 바다와 바람을 만끽할 수 있었습니다.</p>
        <p>마지막 날에는 카페와 시장을 방문해 지역 음식을 맛보고, 해질녘 바닷가에서 하루를 마무리했습니다.</p>
        <p>짧은 일정이었지만, 바다의 풍경과 함께 자연을 느끼며 몸과 마음이 모두 힐링되는 시간이었습니다.</p>
    </div>
</body>
</html>
