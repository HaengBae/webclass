<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그의 속성 편집하기</title>
    <style>
        .b.on{
            background-color: blue;
            color: #fff;
        }
    </style>
</head>
<body>
    <figure>
        <img src="./img/최윤성.png" alt="최윤성" class="a">
        <figcaption class="b">최윤성</figcaption>
    </figure>
    <script>
        //태그를 저장할때는 let 보다 const를 많이 쓴다.
        const img = document.querySelector('.a');
        //img.getAttribute('src');                  //불러오는
        img.setAttribute('src','./img/윤희정.png');  //교체하는
        //alert(img.getAttribute('src'))
        const figcaption = document.querySelector('.b');
        //figcaption.textContent;
        //figcaption.innerText = '윤희정';
        figcaption.innerHTML = '<i>윤희정</i>';      //태그를 넣을 수 있어서 text 보다 html을 더 많이 사용함
        figcaption.classList.add('on');             //class 추가
        figcaption.classList.remove('on');          //class 삭제
    </script>

    <ul class="list">
        <li>1</li>
        <li class="me">2</li>
        <li>3</li>
        <li>4</li>
    </ul>
    <script>
        let me = document.querySelector('.me')
        me.parentElement.style.border ="2px solid green";                   //부모태그
        me.nextElementSibling.nextElementSibling.style.color = "blue";      //다음태그
        me.previousElementSibling.style.color ="gold";                      //이전태그
        console.log(me.parentElement.previousElementSibling);               //이전 이전태그 스크립트가 선택됨
        let list = document.querySelector('.list');
        let listTag = list.children
        //자식들이 배열형태로 선택됨 [{},{},{},{}..]
        listTag[0].style.background = "red"

</script>

</body>
</html>
