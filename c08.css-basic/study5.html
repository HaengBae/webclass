<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스타일 상속</title>
    <style>
        div#a {color: red;} /*상속스타일-간접적용*/
        p {color: blue;} /*직접적용이 우선순위가 됨*/
    </style>
</head>
<body>
    <h1>스타일 상속</h1>
    <div id="a">
        <p>글자</p>
    </div>
</body>
</html>
