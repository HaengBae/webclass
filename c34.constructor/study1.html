        function Person(option){
            this.name = option.n
            this.gender = option.g
            this.sayHello = function(){
                alert(`안녕하세요. 저는${this.name}입니다. `)
            }
        }
        let person1 = new Person({
            n:'둘리'
            g:'남자'
        })
        let person1 = new Person({n:'둘리',g:'남자'});
        let person2 = new Person({n:'길동',g:'남자'});
        let person3 = new Person({n:'또치',g:'여자'});





        
        person1.sayHello();
        person2.sayHello();
        person3.sayHello();
    </script>
