<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산도구</title>
</head>
<body>
    <script>
        console.log (Math.ceil(5.33)) //올림        6
        console.log (Math.floor(5.99)) //내림       5 
        console.log (Math.round(5.5)) //반올림      6
        console.log (Math.pow(10,2)) // 10에 2승    100 
        console.log (Math.sqrt(100)) //루트계산     10
        console.log (Math.abs(-30)) // 절대값계산   30 (부호가 없어짐)
        console.log (Math.max(2,31,5,6,45,1)) //()의 숫자중 최대값
        console.log (Math.min(2,31,5,6,45,1)) //()의 숫자중 최소값     
        console.log (Math.random()) // 0~1사이의 랜덤값 0.42316
        console.log (Math.round((Math.random()*44)+1)) // 0~45사이의 랜덤값
        console.log (3.5463156166.toFixed(3)) //소수점 세자리까지 표시 (반올림)
    </script>
</body>
</html>
