<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값으로서 사용되는 함수</title>
</head>
<body>
    <script>
        function a(){
            alert('aaa')
        }
        // 호이스팅 : function은 읽히는제 제일 상단으로 옮기기 때문에 실행부의 위치와 상관기 없다.


        let b = function(){
            alert('bbb')
        }

        //function(){} 익명함수 = 동작함수

        let c = ()=>{
            alert('ccc')
        }  // function의 간단 버전 "=>"
        c()


        let d = (name)=>{
            alert(name+"님 방갑습니다.")
        }
        d('홍길동')

        let g = name => alert(name+"님 방가방가")
        g('홍길동')
        //매게변수가 한개면 ()를 생략할 수 있음
        //변수도 한줄이면 {}를 생략가능, 대신 한줄로 넣어야 함

        let sum = (a,b)=>{
            return a+b
        }
        // alert(sum(2,3))

        let sum2 = (a,b)=>a+b
        //return도 생략가능
        // alert(sum2(10,20))


        function abc(title){
            //a = function(){}이 출력됨
            a()
        }
        abc(function(){alert('test')})






        



    </script>
    
</body>
</html>
