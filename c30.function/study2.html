<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값으로서 사용되는 함수</title>
</head>
<body>
    <script>
        function a(){
            alert('aaa')
        }
        // 설명 : 호이스팅 = function은 읽히는제 제일 상단으로 옮기기 때문에 실행부의 위치와 상관기 없다.


        let b = function(){
            alert('bbb')
        }

        //설명 : function(){} 익명함수 = 동작함수

        let c = ()=>{
            alert('ccc')
        }  // 설명 : function의 간단 버전 "=>"
        //c()


        let d = (name)=>{
            alert(name+"님 방갑습니다.")
        }
       // d('홍길동')

        let g = name => alert(name+"님 방가방가")
        //g('홍길동')
        //설명 : 매게변수가 한개면 ()를 생략할 수 있음
        //설명 : 변수도 한줄이면 {}를 생략가능, 대신 한줄로 넣어야 함

        let sum = (a,b)=>{
            return a+b
        }
        // alert(sum(2,3))

        let sum2 = (a,b)=>a+b
        //설명 : return도 생략가능
        // alert(sum2(10,20))


        function abc(title){
            //설명 : a = function(){}이 출력됨 - 익명함수
            a()
        }
       abc(function(){alert('test')})
       // 설명 : a라는 함수의 콜백되는 함수
       // 설명 : 버튼을 누를때 변화가 일어날때 사용


        function getAver2(arr,sosu){
            let sum = 0
            for(let i=0 ; i<arr.length ; i++){
                sum += arr[i]
            }
            return (sum / arr.length).toFixed(sosu)
        }
        // alert(getAver2([10,3,4,5,1,2,3,5],1))

        //설명 : 사물 -> 객체 (동작을 표현할수 있다.)
        let fan = {
            body:"#000",
            height:120,
            width:30,
            weight:6,
            powerOn:function(){
                alert('선풍기 전원이 켜졌습니다.')
                this.fanSpeed=1
            },
            powerOff:function(){
                alert('선풍기 전원이 꺼졌습니다.')
                this.fanSpeed=0
            },
            fanSpeed:0,
            fanSpeedUp:function(){
                // 이 선풍기의 팬 스피드를 올리는 기능
                // 이렇게 하면 안됨 : fanSpeed= fanSpeed+1
                this.fanSpeed+=1
            },             
            fanSpeedDown:function(){
                this.fanSpeed-=1
            },
            showFanSpeed:function(){
                alert(`현재 선풍기의 풍속은 ${this.fanSpeed}단계입니다.`)
            }

            
        }

        //설명 : lef fan = {프로퍼티, 프로퍼티(메서드)} - 프로퍼티 안에 동작을 method라 함

        fan.body
        fan.weight
        fan.powerOn()
        fan.powerOff()
        fan.showFanSpeed()
        //alert(fan.fanSpeed)
        fan.powerOn()
        fan.showFanSpeed()
        //alert(fan.fanSpeed)
        fan.fanSpeedUp()
        fan.showFanSpeed()
        //alert(fan.fanSpeed)









        



    </script>
    
</body>
</html>
