<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>
</head>
<body>
    <script>
       
        // 함수라는 건 alert(), console.log(), prompt(), Number() 등등 같은것.
        // () = 실행해라


        //정의부
        function a(){
            alert('안녕하세요.')
        }
        //실행부
        //a()


        function b(name,age){
            document.write(`<p>${name}님 안녕하세요.</p>`)
            document.write(`<p>${name}님은 ${age}살 이시군요.</p>`)

        }
        b('홍길동',45)
        b('영심이',25)


        //function b(매개변수)
        //b(인자)






    </script>
</body>
</html>
