<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Marquee</title>
  <link rel="stylesheet" href="css/study3.css">
</head>
<body>
  <section class="marquee" aria-label="Notice">
    <div class="marquee__track">
      <div class="marquee__group">
        <span>WELCOME TO WEB CLASS</span>
        <span>HTML / CSS / JAVASCRIPT</span>
        <span>KEEP LEARNING, KEEP GROWING</span>
        <span>***</span>
      </div>
      <!-- Duplicate the group for a seamless loop. -->
      <div class="marquee__group" aria-hidden="true">
        <span>WELCOME TO WEB CLASS</span>
        <span>HTML / CSS / JAVASCRIPT</span>
        <span>KEEP LEARNING, KEEP GROWING</span>
        <span>***</span>
      </div>
    </div>
  </section>
</body>
</html>
