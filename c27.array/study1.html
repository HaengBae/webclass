<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 Array</title>
</head>
<body>
    <script>
        let a=[1,3,4,'안녕',66,true,['abc','bde',3,4]][1] // []는 0번째 부터 카운딩시작 
        //배열안에 배열이 들어갈수 있음
        //a[3][1] // a[3] = 안녕  →  안녕[1] = 녕
        //a[5]?'c':'d' // a
        //a[6][0][0] // a[6] = ['abc','bde',3,4] → a[6][0] = 'abc' → a[6][0][0] =a
        let fruits=['멜론','수박','복숭아','자두','골드키위','참외']        
        console.log(fruits)
        fruits.pop()
        console.log(fruits)
        fruits.push('바나나')
        console.log(fruits)
        console.log(fruits.length)  //원소의 저장개수
        fruits.splice(2,2,'샤인머스캣','포도') // 2=복숭아, 뒤에 2는 2개 = 복숭아와 자두가 모두 지워짐, 세번째부터는 , 는 추가
        console.log(fruits)

        let classMate = [
            '유채린',
            '배수정',
            '최윤성',
            '최선미',
            '김가온'
        ]
        let newClass = ['윤희정',...classMate,'안정현',]
        console.log(newClass)







        console.log()
        console.log()
        console.log()

    </script>
    <h1>배열 -array</h1>
    <p>연관된 데이터들을 모아 놓은 집합</p>
    <p>배열은 ,(콤마)로 구분하여 원소을 여러개 입력할 수 있다.</p>
    <p>배열은 순번이라는 개념이 있다. (먼저 저장된순서 -> 0부터 시작) </p>

</body>
</html>
