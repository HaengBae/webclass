<!DOCTYPE html>
<html lang="kog">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼항연산자</title>
</head>
<body>
    <script>
        //삼항연산 기호 ? 와 : 
        5>3?"가":"나"
        // ? 앞에 조건이 ture 면 "가" false면 "나"
        5<3?"가":"나"       //나 ture
        !(5<3)?"가":"나"    //나
        10!==10?"다":"라"   //라
        100?'a':'b'        //a
        10-2?1:2            //1
        10-2?1:2?2:0        //1 (10-2)?1:(2?2:0) = 8?1:2 로 계산되서 1임  
        (10-2?1:2)?2:0      //2
        32<20?'a':5===5?'c':'d' // c [32<20]?'a':[5===5?'c':'d'] = 거짓 뒤에 는 참 = c

        let name = prompt('이름을 입력해주세요.')
        name = name?name:prompt('다시입력하세요.') //한번 입력
        console.log(name)
        document.write (`<h1>${name}님 환영합니다.</h1>`)

        

    </script>
</body>
</html>
