<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 - variable</title>
</head>
<body>
    <script>
        10 // 상수
        '안녕' //상수
        let a;
        // a라는 변수공간을 (let)를 만든다. - a라는 변수의 선엄
        a = 10; // 최초로 저장됨 - 초기화
        console.log (a)
        a = '안녕'; // a라는 변수를 '안녕으로 재 저장'
        console.log (a)
        // 스크립트는 줄바꿈으로 다음 순서의 새로운 값이 저장됨 위에 a 10 하단 a는 안녕이라고 표현됨
        let b = 20; // b라는 변수를 선언하고, 20으로 초기화
        console.log (b)
        b = '하세요';
        console.log (b);
        console.log (a+b) ; //안녕하세요.
        let c = a+b
        console.log (c); //안녕하세요.
        console.log (c[2]+c[4]); // 하요 -  첫번째가 0부터 시작

        //변수가 만들어 진다음에 변수를 불러와야 함

        let d;
        const BIRTH = '0101';
        console.log (BIRTH);

        //상수형 변수 - 초기화 내용으로 저장된 내용 이후에 변하지 않음 ex) 생일

        

        
    </script>
</body>
</html>
