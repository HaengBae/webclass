<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제</title>
</head>
<body>
    <h1>CREATE YOUR ACCOUNT</h1>
    <form action="#">
        <div>
            <label for="email">Email Adderss</label>
            <input type="text" id="email" name="email">
        </div>
        <div>
            <label for="confirmEmail">Confirm Your Address</label>
            <input type="text" id="confirmEmail" name="confirmEmail">
        </div>
        <div>
            <label for="adderss">Country of Residence</label>
            <select id="adderss" name="adderss">
                <option value="island">Aland Islands</option>
                <option value="bahamas">Bahamas</option>
                <option value="china">China</option>
                <option value="denmark">Denmark</option>
                <option value="egypt">Egypt</option>
                <option value="france">France</option>
                <option value="kingdom">United kingdom</option>
                <option value="korea" selected>Korea, Republic of</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="agree" name="agree">
            <label for="agree">I am 13 years of age or older and agree to the terms of the <i>Steam Subscriber Agreement</i> and the <i>Valve Privacy policy.</i></label>
        </div>
        <input type="submit" value="Continue">
    </form>
</body>
</html>
