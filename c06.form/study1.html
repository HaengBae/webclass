<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양식 태그</title>
    <style>
        fieldset{margin: 40px 0 40px 0; padding: 20px;}
        input {margin: 5px; padding: 10px;}
        select {margin: 5px; padding: 10px;}
        textarea {margin: 5px; padding: 0px; height: 200px;}
    </style>
</head>
<body>
    <h1>양식 태그</h1>
    <form action="#">
        <div>
            <label for="user-id">아이디</label>
            <input type="text" id="user-id" placeholder="아이디를 입력" value="abcd" readonly>
            <!--required : 필수적으로 꼭 입력해야 하는 필드를 설정할때 쓰임-->
            <!--redonly 는 Value 값을 설정해 놓은 -->
        </div>
        <div>
            <label for="user-pw">비밀번호</label>
            <input type="password" id="user-pw" placeholder="비밀번호를 입력해주세요.">
        </div>
        <div>
            <input type="submit" value="로그인">
        </div>
        <hr>
        <div>
            <form action="" enctype="multipart/form-data">
                <fieldset>
                    <legend>계정 정보</legend>
                    <div>
                        <label for="userId">아이디</label>
                        <input type="text" id="userID" placeholder="아이디 입력" name="userID" value="수정눌렀을때 막는" disabled>
                    </div>
                    <div>
                        <label for="userPw">비밀번호</label>
                        <input type="password" id="userPw" placeholder="비밀번호 입력" name="userPw">
                    </div>
                    <div>
                        <label for="userPw2">비밀번호확인</label>
                        <input type="password" id="userPw2" placeholder="비밀번호 확인 입력" name="userPw2">
                    </div>
                    <p>비밀번호는 영대문자와 영소문자, 특수문자를 포함시켜 주세요.</p>
                </fieldset>
                <fieldset>
                    <legend>개인 정보</legend>
                    <div>
                        <label for="userName">이름</label>
                        <input type="text" id="userName" placeholder="이름 입력" name="userName">
                    </div>
                    <div>
                        <label for="userGender">성별</label>
                        <input type="radio" id="man" name="userGender" >
                        <label for="man">남자</label>
                        <input type="radio" id="woman" name="userGender" checked>
                        <label for="woman">여자</label>
                        <input type="radio" id="notGender" name="userGender">
                        <label for="notGender">공개안함</label>
                    </div>
                    <div>
                        <label for="userBirht">생년월일</label>
                        <input type="date" id="userBirht" name="userBirht">
                    </div>
                    <div>
                        <label for="">전화번호</label>
                        <select name="telecomMenu" id="telecomMenu">
                            <option value="선택안함">선택안함</option>
                            <option value="skt">SKT</option>
                            <option value="kt" selected>KT</option>
                            <option value="lgu">U+</option>
                            <option value="알뜰폰">알뜰폰</option>
                        </select>
                        <input type="number" name="telecomNumber" value="1234"><input type="number" name="telecomNumber" value="0000">
                        <a href="#">인증요청</a>
                    </div>
                    <div>
                        <label for="confirnNumber">인증확인번호</label>
                        <input type="number" id="confirnNumber">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>기타정보</legend>
                    <div>
                        <label for="userPhoto">프로필 사진</label>
                        <input type="file" id="userPhoto" name="userPhoto">
                    </div>
                    <div>
                        <label for="userProfiltText">자기소개글</label>
                        <textarea name="userProfiltText" id="userProfiltText">
                            이름 :
                            전화번호 :
                            자기소개 :
                        </textarea>
                    </div>             
                </fieldset>
                <fieldset>
                    <legend>개인정보처리방침</legend>
                    <p>개인정보처리방침 전문</p>
                    <div>
                        <input type="checkbox" id="userAgree" name="userAgree">
                        <label for="userAgree">개인정보처리방침에 동의합니다.</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>제출</legend>
                    <button type="submit">회원가입</button>
                    <button type="reset">취소하기</button>
                </fieldset>             
            </form>
        </div>

    </form>
</body>
</html>
